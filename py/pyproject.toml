[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llnl-clippy"
authors = [
  { name="Roger Pearce"}, { name="Seth Bromberger"}
]
description="A Python interface to HPC resources"
readme = "README.md"
license = "MIT"
dynamic = ["dependencies", "optional-dependencies", "version"]

requires-python = ">=3.10"

classifiers = [
        "Development Status :: 3 - Alpha",
        "Programming Language :: Python :: 3",
        "Programming Language :: C++",
        "Intended Audience :: Science/Research",
        "Operating System :: OS Independent"
]

[tool.setuptools.dynamic]
version = {file = "src/clippy/VERSION"}
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {dev = {file = ["requirements-dev.txt"] }}


[project.urls]
Homepage = "https://github.com/LLNL/clippy"
Issues = "https://github.com/LLNL/clippy/issues"

[tool.mypy]
exclude = [
    "^build/",
    "attic/",
    "^venv/",
    "^tests/",
]

[tool.ruff]
lint.select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
line-length = 120
